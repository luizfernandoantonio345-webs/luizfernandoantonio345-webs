<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Luiz Fernando — Desenvolvedor Backend Python e TypeScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3A6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2A44" stroke-width="1"/>
    </pattern>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .chip{fill:#16223B;stroke:#2A3A5E}
      .dot{animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity=".55"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- status -->
  <g transform="translate(64,58)">
    <rect width="300" height="30" rx="15" fill="#0F2A24" stroke="#1F6B55"/>
    <circle class="dot" cx="18" cy="15" r="5" fill="#22D3A6"/>
    <text x="32" y="20" class="f" font-size="13" font-weight="600" fill="#7EF0CF">Aberto a oportunidades · CLT / PJ</text>
  </g>

  <text x="64" y="150" class="f" font-size="54" font-weight="800" fill="#F1F5F9" letter-spacing="-1">Luiz Fernando</text>
  <text x="64" y="192" class="f" font-size="24" font-weight="600" fill="url(#accent)">Desenvolvedor Backend · Python &amp; TypeScript</text>
  <text x="64" y="224" class="f" font-size="16" fill="#94A3B8">SaaS multi-tenant para a indústria — do modelo de dados ao deploy em produção</text>

  <!-- chips -->
  <g class="m" font-size="13" fill="#CBD5E1">
    <g transform="translate(64,250)"><rect class="chip" width="84" height="30" rx="8"/><text x="14" y="20">Python</text></g>
    <g transform="translate(158,250)"><rect class="chip" width="88" height="30" rx="8"/><text x="14" y="20">FastAPI</text></g>
    <g transform="translate(256,250)"><rect class="chip" width="114" height="30" rx="8"/><text x="14" y="20">PostgreSQL</text></g>
    <g transform="translate(380,250)"><rect class="chip" width="84" height="30" rx="8"/><text x="14" y="20">NestJS</text></g>
    <g transform="translate(474,250)"><rect class="chip" width="84" height="30" rx="8"/><text x="14" y="20">Docker</text></g>
    <g transform="translate(568,250)"><rect class="chip" width="70" height="30" rx="8"/><text x="14" y="20">React</text></g>
  </g>

  <!-- code card -->
  <g transform="translate(760,64)">
    <rect width="376" height="206" rx="12" fill="#0A0F1C" stroke="#2A3A5E"/>
    <circle cx="20" cy="20" r="5" fill="#F87171"/><circle cx="38" cy="20" r="5" fill="#FBBF24"/><circle cx="56" cy="20" r="5" fill="#34D399"/>
    <text x="76" y="24" class="m" font-size="11" fill="#64748B">app/api/ponto.py</text>
    <g class="m" font-size="13">
      <text x="20" y="62"><tspan fill="#C084FC">@router</tspan><tspan fill="#E2E8F0">.post(</tspan><tspan fill="#86EFAC">"/registros"</tspan><tspan fill="#E2E8F0">)</tspan></text>
      <text x="20" y="84"><tspan fill="#60A5FA">async def</tspan><tspan fill="#FDE68A"> registrar</tspan><tspan fill="#E2E8F0">(</tspan></text>
      <text x="40" y="106"><tspan fill="#E2E8F0">data: </tspan><tspan fill="#5EEAD4">RegistroIn</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="40" y="128"><tspan fill="#E2E8F0">tenant: </tspan><tspan fill="#5EEAD4">Tenant</tspan><tspan fill="#E2E8F0"> = Depends(</tspan><tspan fill="#FDE68A">current_tenant</tspan><tspan fill="#E2E8F0">),</tspan></text>
      <text x="20" y="150"><tspan fill="#E2E8F0">) -&gt; </tspan><tspan fill="#5EEAD4">RegistroOut</tspan><tspan fill="#E2E8F0">:</tspan></text>
      <text x="40" y="172"><tspan fill="#60A5FA">await</tspan><tspan fill="#E2E8F0"> audit.</tspan><tspan fill="#FDE68A">log</tspan><tspan fill="#E2E8F0">(tenant, data)</tspan></text>
      <text x="40" y="194"><tspan fill="#60A5FA">return await</tspan><tspan fill="#E2E8F0"> ponto.</tspan><tspan fill="#FDE68A">registrar</tspan><tspan fill="#E2E8F0">(data)</tspan></text>
    </g>
  </g>
</svg>
